name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege for the workflow token

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SOCLAB_OFFLINE: "1"  # CI never calls real threat-intel APIs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip  # old pip versions have known CVEs
          pip install -e ".[dev]"
      - name: Dependency consistency
        run: pip check  # fails on conflicts, e.g. a package silently downgrading pySigma
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy src
      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src
      - name: Dependency vulnerabilities (pip-audit)
        # One accepted, unreachable vulnerability (ADR 0006); any other finding fails the build.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-2447
      - name: Tests
        run: pytest
