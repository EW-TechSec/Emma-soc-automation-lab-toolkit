name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege for the workflow token

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SOCLAB_OFFLINE: "1"  # CI never calls real threat-intel APIs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src
      - name: Tests
        run: pytest
