name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege for the workflow token

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SOCLAB_OFFLINE: "1"  # CI never calls real threat-intel APIs
    steps:
      # Actions pinned to commit SHAs: a tag can be re-pointed to other code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          # Upgrade the tools bundled with the interpreter: Python 3.11 ships a setuptools
          # with PYSEC-2026-3447 (fixed in 83.0.0), which pip-audit flags.
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
      - name: Dependency consistency
        run: pip check  # fails on conflicts, e.g. a package silently downgrading pySigma
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy src
      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src
      - name: Dependency vulnerabilities (pip-audit)
        # One accepted, unreachable vulnerability (ADR 0006); any other finding fails the build.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-2447
      - name: Tests
        run: pytest
