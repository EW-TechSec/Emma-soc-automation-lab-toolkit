title: SSH Password Spray
id: 3513cfd3-1132-4379-a49a-795340aef147
name: ssh_password_spray
status: experimental
description: |
  Failed SSH logins for many different accounts from the same source: one
  password tried against many users, slowly, to stay under per-account lockout
  thresholds. Counting DISTINCT usernames catches it even though each account
  only sees one or two failures.
  Threshold: 10 distinct users in 30 minutes. A legitimate source (a jump host,
  a NAT gateway for staff) rarely fails for that many different accounts.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Emma
date: 2026-10-23
tags:
  - attack.credential_access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - ssh_failed_login
  group-by:
    - source.ip
  timespan: 30m
  condition:
    field: user.name
    gte: 10
falsepositives:
  - Many users behind one NAT address all failing (e.g. after a forced password reset)
  - Vulnerability scanners testing default credentials (should be allow-listed)
level: high
