[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soclab"
version = "0.1.0"
description = "Emma SOC Automation Lab: detection, enrichment, triage and response pipeline for SOC and threat-intel work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pysigma>=2.0,<3",  # official Sigma parser: the detection engine and KQL backend build on it
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "responses>=0.25",  # mocks HTTP calls to threat-intel APIs in tests
]

[tool.hatch.build.targets.wheel]
packages = ["src/soclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=soclab --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, S: security (bandit rules), UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works
# pySigma requires attributes named *_token (or_token, and_token, ...): query grammar, not secrets
"src/soclab/kql.py" = ["S105"]

[tool.bandit]
exclude_dirs = ["tests"]
